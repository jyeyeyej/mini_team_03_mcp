services:
  db:
    image: postgres:17-alpine
    container_name: weather-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-weather}
      POSTGRES_USER: ${POSTGRES_USER:-weather_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-weather_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - weather_pgdata:/var/lib/postgresql/data
      - ./db/init/01_weather_tables.sql:/docker-entrypoint-initdb.d/01_weather_tables.sql:ro
      - ./db/seed/01_weather_data.sql:/docker-entrypoint-initdb.d/02_weather_data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  weather_pgdata:
