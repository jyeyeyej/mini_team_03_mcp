services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-travel_mcp}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init/01_hotel_tables.sql:/docker-entrypoint-initdb.d/01_hotel_tables.sql:ro
      - ./db/init/02_spot_tables.sql:/docker-entrypoint-initdb.d/02_spot_tables.sql:ro
      - ./db/seed/01_hotel_data.sql:/docker-entrypoint-initdb.d/11_hotel_data.sql:ro
      - ./db/seed/02_spot_data.sql:/docker-entrypoint-initdb.d/12_spot_data.sql:ro

volumes:
  postgres_data:
